services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://guardian:guardian@postgres:5432/privacy_guardian
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: privacy_guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:

