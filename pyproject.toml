[project]
name = "mobile-privacy-guardian"
version = "0.1.0"
description = "AI-powered mobile privacy and security guardian backend."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "langchain>=0.2.14",
  "langgraph>=0.2.14",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.0",
  "bandit[toml]>=1.7.9",
  "pip-audit>=2.7.3",
]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
