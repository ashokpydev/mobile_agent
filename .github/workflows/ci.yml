name: CI

on:
  pull_request:
  push:
    branches: [main, privacy-agent]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest

